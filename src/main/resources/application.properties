spring.application.name=ProgramacionWeb001

# ============================================================
# ACTIVE PROFILE
# ============================================================
# dev  \u2192 H2 in-memory (default, zero-config, used on any machine)
# prod \u2192 PostgreSQL (opt-in with -Dspring.profiles.active=prod)
spring.profiles.active=dev

# ============================================================
# THYMELEAF
# ============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ============================================================
# ENCODING \u2014 ensures accented characters (\u00e9, \u00e0, \u00f1) work
# ============================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ============================================================
# LOGGING
# ============================================================
logging.level.org.springframework.data.jpa=DEBUG