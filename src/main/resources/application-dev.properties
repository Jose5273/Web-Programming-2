# ============================================================
# DEV PROFILE \u2014 H2 in-memory database
# ============================================================
# No external server needed. Fresh DB on every startup.
# Ideal for demos, testing, and clean-machine runs.
# ============================================================

# ---------- Datasource: H2 in-memory ----------
spring.datasource.url=jdbc:h2:mem:programacionweb01;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- SQL Init (loads data.sql automatically) ----------
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.encoding=UTF-8

# ---------- H2 Web Console ----------
# Open in browser: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:programacionweb01
# User: sa    Password: (leave empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console