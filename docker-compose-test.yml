services:
  version: '3.8'
  services:
    db-test:
      image: postgres:15-alpine
      container_name: postgres_test
      environment:
        POSTGRES_DB: programacionweb_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: test_password
      ports:
        - "5434:5432"
      volumes:
        - postgres_test_data:/var/lib/postgresql/data

    app-test:
      build: .
      container_name: spring_app_test
      ports:
        - "8081:8080" # Usamos el 8081 en la EC2
      environment:
        - SPRING_PROFILES_ACTIVE=test
        - DB_HOST=db-test
        - DB_PORT=5432
        - DB_NAME=programacionweb_test
        - DB_USER=postgres
        - DB_PASSWORD=test_password
      depends_on:
        - db-test

  volumes:
    postgres_test_data: