name: CI/CD Pipeline - Test Environment

on:
  push:
    branches: [ test ]
  pull_request:
    branches: [ test ]
  workflow_dispatch:

jobs:
  test-and-deploy:
    name: Run Tests and Deploy to AWS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Playwright browsers
        run: |
          mvn -q org.codehaus.mojo:exec-maven-plugin:3.5.0:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium" \
            -Dexec.classpathScope=test

      # --- PASO CORREGIDO ---
      - name: Install Playwright OS dependencies
        run: |
          sudo mvn exec:java -e \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install-deps" \
            -Dexec.classpathScope=test

      - name: Run E2E tests
        run: mvn -B test -Dtest=AppE2ETest

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-videos
          path: target/videos/
          retention-days: 30

      # --- DESPLIEGUE A AWS (Solo en push a la rama test) ---
      - name: Deploy to AWS EC2
        if: github.event_name == 'push' && github.ref == 'refs/heads/test'
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            if [ ! -d "/home/ec2-user/Web-Programming-2" ]; then
              git clone https://github.com/Jose5273/Web-Programming-2.git /home/ec2-user/Web-Programming-2
            fi
            cd /home/ec2-user/Web-Programming-2
            git fetch origin
            git checkout test
            git pull origin test
            docker compose -f docker-compose-test.yml down
            docker compose -f docker-compose-test.yml up -d --build
